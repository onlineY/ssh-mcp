name: ci

# 每次推送到主分支或开 PR 都跑测试，防止坏代码进入主干
on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: 测试 (Python ${{ matrix.python-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 安装依赖
        run: uv sync --extra dev --python ${{ matrix.python-version }}

      - name: 跑测试
        run: uv run --no-sync pytest -q

      - name: 静态检查
        shell: bash
        run: |
          uv run --no-sync --with pyflakes python -m pyflakes \
            src/ssh_hop/*.py tests/*.py
